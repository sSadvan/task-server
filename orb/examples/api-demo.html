<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb API Demo</title>
<link rel="stylesheet" href="../src/orb.css">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; background: #05070d; color: #d5ddee;
    font: 13px/1.5 system-ui, sans-serif;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px;
  }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; } }
  #stage { display: grid; place-items: center; --orb-size: min(420px, 90vw); }
  h1 { font-size: 15px; margin: 0 0 8px; }
  #log {
    margin: 0; padding: 12px; min-height: 300px; max-height: 80vh; overflow: auto;
    background: #0b0f1a; border: 1px solid #1d2638; border-radius: 8px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  }
  #log .ret { color: #7d89a3; }
  button { font: inherit; color: inherit; background: #111827; border: 1px solid #1d2638; border-radius: 6px; padding: 5px 12px; margin-bottom: 10px; cursor: pointer; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div>
    <h1>Public API walkthrough</h1>
    <button id="run" type="button">Run again</button>
    <pre id="log" aria-live="polite"></pre>
  </div>

<script type="module">
  import { OrbEngine } from '../src/orb-engine.js';

  const orb = await OrbEngine.mount(document.getElementById('stage'), { src: '../assets/orb.svg' });
  window.orb = orb;
  const log = document.getElementById('log');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const show = (code, ret) => {
    log.insertAdjacentHTML('beforeend', `${code}${ret === undefined ? '' : `  <span class="ret">→ ${JSON.stringify(ret)}</span>`}\n`);
    log.scrollTop = log.scrollHeight;
  };
  // Run a call, print it with its result.
  const call = async (code, fn, pause = 1600) => { show(code, fn()); await wait(pause); };

  let running = false;
  async function demo() {
    if (running) return;
    running = true;
    log.textContent = '';
    orb.resetParameters();
    orb.setState('idle', { immediate: true });

    await call('orb.setState("listening")', () => orb.setState('listening'), 400);
    for (let i = 0; i < 50; i++) { orb.setAudioLevel(Math.abs(Math.sin(i / 3)) * 0.8); await wait(50); }
    show('orb.setAudioLevel(0..0.8)  // fed every 50 ms', true);
    await call('orb.setState("processing")', () => orb.setState('processing'));
    await call('orb.setParameter("animationSpeed", 2.8)', () => orb.setParameter('animationSpeed', 2.8));
    await call('orb.setParameter("glowIntensity", 0.9)', () => orb.setParameter('glowIntensity', 0.9));
    await call('orb.setState("memory")', () => orb.setState('memory'));
    await call('orb.setSymbol("network")', () => orb.setSymbol('network'));
    await call('orb.setState("idle")', () => orb.setState('idle'));
    await call('orb.setColors({ primary: "#00AEEF", secondary: "#5B6CFF" })',
      () => orb.setColors({ primary: '#00AEEF', secondary: '#5B6CFF' }));
    await call('orb.setParameters({ pulseIntensity: 0.5, breathingIntensity: 0.6 })',
      () => orb.setParameters({ pulseIntensity: 0.5, breathingIntensity: 0.6 }));
    await call(`orb.registerSymbol("heart", '<path d="M0 30C-40 4 -36 -30 -14 -30C-4 -30 0 -20 0 -16C0 -20 4 -30 14 -30C36 -30 40 4 0 30Z"/>')`,
      () => orb.registerSymbol('heart', '<path d="M0 30C-40 4 -36 -30 -14 -30C-4 -30 0 -20 0 -16C0 -20 4 -30 14 -30C36 -30 40 4 0 30Z"/>'), 200);
    await call('orb.setSymbol("heart")', () => orb.setSymbol('heart'));
    await call('orb.setState("teleporting")  // invalid → false + console warning', () => orb.setState('teleporting'), 400);
    await call('orb.setParameter("glowIntensity", 7)  // clamped to max 1', () => orb.setParameter('glowIntensity', 7), 400);
    await call('orb.getParameter("glowIntensity")', () => orb.getParameter('glowIntensity'), 400);
    await call('orb.getState()', () => orb.getState(), 400);
    await call('orb.resetParameters()', () => orb.resetParameters());
    show('orb.exportConfig().length', orb.exportConfig().length);
    running = false;
  }
  document.getElementById('run').addEventListener('click', demo);
  demo();
</script>
</body>
</html>
